<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Odin Restaurant Page</title><script defer="defer" src="js/runtime.9ff9f2b301d6fcf8210a.js"></script><script defer="defer" src="js/main.d4d9f13935866cde3a40.js"></script><link href="css/main.46675a5497a10b664ffa.css" rel="stylesheet"></head><body><div id="root"></div><script>// Single Page Apps for GitHub Pages — restores the real path
      // that 404.html encoded, using history.replaceState.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);</script></body></html>
